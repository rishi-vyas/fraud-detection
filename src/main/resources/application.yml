spring:
  application:
    name: fraud-detection
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: fraud-detector
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer turns malformed payloads ("poison pills") into
      # errors the container can route to the dead-letter topic instead of crash-looping.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.rishivyas.fraud.model.Transaction
        spring.json.trusted.packages: com.rishivyas.fraud.model
        spring.json.use.type.headers: false
    listener:
      ack-mode: record
      concurrency: 3

fraud:
  scoring:
    review-threshold: 40
    decline-threshold: 70
  rules:
    high-amount: 5000
    velocity-max-transactions: 5
    velocity-window: 60s
    spike-multiplier: 5.0
    spike-min-history: 5
    max-travel-speed-kmh: 900
    min-travel-distance-km: 100
    new-device-amount: 1000
    high-risk-categories: [GAMBLING, CRYPTO, MONEY_TRANSFER, GIFT_CARDS]
  topics:
    transactions: transactions
    decisions: fraud-decisions
    alerts: fraud-alerts
    partitions: 6
  decision-cache-size: 100000
  simulator:
    enabled: false
    interval-ms: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
